<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA2026 | Edit Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #080b18, #101936, #070a14);
            color: white;
        }

        .navbar {
            height: 70px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 14, 35, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #6ee7ff;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: #d7def7;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #6ee7ff;
        }

        .logout {
            background: #ff4d6d;
            padding: 9px 16px;
            border-radius: 20px;
            color: white !important;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .title p {
            color: #aab4d6;
        }

        .card {
            background: rgba(20, 27, 55, 0.92);
            border: 1px solid rgba(110, 231, 255, 0.2);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .section-title {
            color: #6ee7ff;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            color: #aab4d6;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(7, 11, 27, 0.8);
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6ee7ff;
            box-shadow: 0 0 10px rgba(110, 231, 255, 0.15);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button,
        .cancel {
            padding: 13px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button {
            border: none;
            color: white;
            background: linear-gradient(135deg, #6ee7ff, #6366f1);
        }

        .cancel {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        button:hover,
        .cancel:hover {
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            color: #6f7898;
            font-size: 13px;
            padding: 40px 20px;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .container {
                width: 94%;
                margin-top: 30px;
            }

            .card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            .cancel {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            NOVA2026
        </div>

        <div class="nav-links">

            <a href="{% url 'student_dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'student_profile' %}">
                Profile
            </a>

            <a href="{% url 'notifications' %}">
                🔔
            </a>

            <a href="{% url 'student_logout' %}" class="logout">
                Logout
            </a>

        </div>

    </nav>


    <main class="container">

        <div class="title">

            <h1>✏️ Edit Profile</h1>

            <p>
                Update your NOVA2026 student information
            </p>

        </div>


        <div class="card">

            <form method="POST">

                {% csrf_token %}

                <h2 class="section-title">
                    👤 Personal Information
                </h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            First Name
                        </label>

                        <input
                            type="text"
                            name="first_name"
                            value="{{ request.user.first_name }}"
                            placeholder="Enter first name"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Last Name
                        </label>

                        <input
                            type="text"
                            name="last_name"
                            value="{{ request.user.last_name }}"
                            placeholder="Enter last name"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            value="{{ request.user.email }}"
                            placeholder="Enter email address"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="text"
                            name="phone"
                            value="{{ profile.phone }}"
                            placeholder="Enter phone number"
                        >

                    </div>

                </div>


                <h2 class="section-title">
                    🎓 Student Information
                </h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Roll Number
                        </label>

                        <input
                            type="text"
                            name="roll_number"
                            value="{{ profile.roll_number }}"
                            placeholder="Example: 23CSE001"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Register Number
                        </label>

                        <input
                            type="text"
                            name="register_number"
                            value="{{ profile.register_number }}"
                            placeholder="Example: 2026CSE001"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Course
                        </label>

                        <input
                            type="text"
                            name="course"
                            value="{{ profile.course }}"
                            placeholder="Example: B.E Computer Science and Engineering"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Semester
                        </label>

                        <input
                            type="number"
                            name="semester"
                            value="{{ profile.semester }}"
                            min="1"
                            max="12"
                            placeholder="Example: 7"
                        >

                    </div>

                </div>


                <div class="buttons">

                    <button type="submit">
                        💾 Save Changes
                    </button>

                    <a
                        href="{% url 'student_profile' %}"
                        class="cancel"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <footer>

        © 2026 NOVA2026 — Intelligent Student Ecosystem

    </footer>

</body>
</html>
